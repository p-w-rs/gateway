# Self-contained runtime for the gateway plugin (v3, SPEC 18).
# Users need only Claude Code + pixi. hooks/launch.sh builds the default env
# into $CLAUDE_PLUGIN_DATA/envs/<sha12 of pixi.lock>/ from a copy of this file
# and pixi.lock (`pixi install --locked`: the lock is used as is and must match
# this manifest; nothing is re-solved or rewritten). The gateway code is
# standard library, except the daemon's sealed boxes (PyNaCl, PLAN-v4 phase 3).
[workspace]
name = "gateway"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]
# pixi.lock is format v7. Tested (2026-10-19, macOS arm64, the launcher's own
# `pixi install --locked --manifest-path` on a copy, scratch cache): 0.68.0,
# 0.69.0, 0.70.0, 0.81.0 and 0.82.0 install it unchanged; 0.61.0-0.67.0 refuse
# ("Lock-file version 7 is newer than supported"). No upper bound: one would
# break every user the day pixi updates (/gate-doctor warns about a pixi newer
# than 0.82.0 instead). Keep in step with hooks/mod/lib.ts and the docs.
requires-pixi = ">=0.68.0"

[dependencies]
python = "3.12.*"
age = "1.3.*"            # the vault's encryption (stdin/stdout only)
gh = "*"                 # GitHub CLI, run only by the gh stand-in (own config dir, injected token)
git-lfs = "*"            # LFS for git pushes/pulls
openssh = "*"            # ssh, scp, sftp, ssh-agent, ssh-add, ssh-keygen, ssh-keyscan: one version everywhere
git = "*"                # fallback only: a git stand-in when the system has no git
pynacl = "1.6.*"         # libsodium for gated: opens the native dialog's sealed boxes (X25519 box)
bash = "5.*"             # the managed shell (PLAN-v4 phase 4): Claude's Bash runs in this bash, never the login shell
tmux = "3.*"             # gated's terminal supervisor (PLAN-v4 phase 5): its own server on a private socket, its own config
pixi-pack = "0.7.*"      # the remote runtime (PLAN-v4 phase 6): packs runtime/pixi.toml for a host's platform
zstd = "1.*"             # the remote runtime: opens the target platform's pixi-unpack conda package (.tar.zst)

# Optional tools, one environment each, installed on first use by the stand-in
# that needs them (`pixi install --locked -e NAME`, one stderr line). The
# gateway finds them in .pixi/envs/NAME/bin.
[feature.hf.dependencies]
huggingface_hub = "*"    # the `hf` CLI
hf-xet = "*"             # Xet storage for large files

[feature.databricks.dependencies]
databricks-cli = "*"

[feature.dvc.dependencies]
dvc = "*"                # asiml workspaces (dvc pull/push through asiml)
dvc-azure = "*"

[feature.registry.dependencies]
crane = "*"              # container registries (the crane stand-in)

# pijul isn't on conda-forge (checked with `pixi search pijul` for all four
# platforms, 2026-10): the pijul stand-in builds it on first use with
# conda-forge's Rust. The gateway runs this task with
# CARGO_INSTALL_ROOT=<plugin data>/pijul, so the binary lands in the data
# folder (it survives plugin updates). Its libgit2 needs iconv: conda-forge's
# libiconv, never the macOS SDK's (nothing calls xcrun). (pijul 1.0.0-beta.24
# doesn't compile without its default `git` feature.)
[feature.pijul.target.unix.dependencies]
rust = "*"
c-compiler = "*"
pkg-config = "*"
openssl = "*"
libsodium = "*"
zstd = "*"
xxhash = "*"
zlib = "*"
libiconv = "*"
[feature.pijul.target.unix.tasks]
# Only the env's libraries: PKG_CONFIG_PATH (never a Homebrew/MacPorts
# copy), CFLAGS (libgit2, pijul's `git` feature, compiles against
# conda-forge's iconv.h and links its libiconv: no macOS SDK lookup, no
# xcrun), and an rpath so the binary finds them (openssl, libsodium, zstd,
# zlib, iconv) in the env's lib folder.
install-pijul = "PKG_CONFIG_PATH=$CONDA_PREFIX/lib/pkgconfig CFLAGS=\"-I$CONDA_PREFIX/include\" RUSTFLAGS=\"-L native=$CONDA_PREFIX/lib -C link-arg=-Wl,-rpath,$CONDA_PREFIX/lib\" cargo install pijul --version 1.0.0-beta.24 --locked"
[feature.pijul.activation.env]
CARGO_HOME = "$PIXI_PROJECT_ROOT/.pixi/cargo"
CARGO_TARGET_DIR = "$PIXI_PROJECT_ROOT/.pixi/cargo-target"

[environments]
hf = ["hf"]
databricks = ["databricks"]
dvc = ["dvc"]
registry = ["registry"]
pijul = ["pijul"]

[tasks]
# The whole offline suite, 4 modules at a time (GW_TEST_TMP=DIR puts its
# temp folders elsewhere; `python tests/run_tests.py MODULE...` runs some).
test = "python tests/run_tests.py -j 4"
# Every tests/mutation_check.py and tests/mutations_*.py, each on a scratch
# copy of the plugin (never this checkout); every mutation must be killed.
mutations = "python tests/run_mutations.py"
# Headless end-to-end runs (claude -p --plugin-dir <scratch copy> against
# local test servers, model haiku, about 6 short sessions); not part of
# `test`. See tests/e2e/README.md (options: --only, --keep, --save DIR).
e2e = "python tests/e2e/run_e2e.py"
# Before a commit (after `git add -A`): does the git index hold the tested
# tree? Read-only (git ls-files); 0 ready, 1 not ready, 2 can't tell.
release-check = "python tests/release_check.py"
