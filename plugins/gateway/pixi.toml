# Self-contained runtime for the gateway plugin.
# Recipients need only Claude Code + pixi; pixi provides the Python and the
# `age` binary below, so no system install is required. All gateway code is
# pure standard library; age decrypts `age:` secret references.
[workspace]
name = "gateway"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = "3.12.*"
age = "1.3.*"
gh = "*"                 # GitHub CLI, run only by the gateway (own config dir, injected token)
git-lfs = "*"            # LFS objects for git pushes/pulls (the gateway runs the hooks' work itself)

# ssh-keygen / ssh-agent / ssh-add for accounts' SSH keys, the same version on
# every platform (Windows has its own OpenSSH).
[target.unix.dependencies]
openssh = "*"

# Optional tools, one environment each, installed on first use. The gateway
# finds them in .pixi/envs/<name>/bin; the tool says which command to run.
[feature.hf.dependencies]
huggingface_hub = "*"    # the `hf` CLI
hf-xet = "*"
[feature.hf.target.linux-64.dependencies]
git-xet = "*"

[feature.databricks.dependencies]
databricks-cli = "*"

[feature.dvc.dependencies]
dvc = "*"
dvc-azure = "*"

[feature.registry.target.unix.dependencies]
crane = "*"
oras = "*"
[feature.registry.target.linux.dependencies]
skopeo = "*"

# pijul isn't packaged: build it from source with conda-forge's Rust.
[feature.pijul.target.unix.dependencies]
rust = "*"
c-compiler = "*"
pkg-config = "*"
openssl = "*"
libsodium = "*"
zstd = "*"
xxhash = "*"
[feature.pijul.target.unix.tasks]
install-pijul = "cargo install pijul --version 1.0.0-beta.24 --locked --root $PIXI_PROJECT_ROOT/.pixi/pijul"
[feature.pijul.target.osx-arm64.tasks]
# libgit2-sys needs the macOS SDK's iconv (conda-forge's libiconv uses other symbol names).
install-pijul = "RUSTFLAGS=\"-L $(xcrun --show-sdk-path)/usr/lib -l iconv\" cargo install pijul --version 1.0.0-beta.24 --locked --root $PIXI_PROJECT_ROOT/.pixi/pijul"
[feature.pijul.target.osx-64.tasks]
install-pijul = "RUSTFLAGS=\"-L $(xcrun --show-sdk-path)/usr/lib -l iconv\" cargo install pijul --version 1.0.0-beta.24 --locked --root $PIXI_PROJECT_ROOT/.pixi/pijul"
[feature.pijul.activation.env]
CARGO_HOME = "$PIXI_PROJECT_ROOT/.pixi/cargo"
CARGO_TARGET_DIR = "$PIXI_PROJECT_ROOT/.pixi/cargo-target"

[environments]
hf = ["hf"]
databricks = ["databricks"]
dvc = ["dvc"]
registry = ["registry"]
pijul = ["pijul"]

[tasks]
server = "python run.py server"
test = "python tests/run_tests.py"
gateway = "python run.py gateway"        # terminal: pixi run gateway finish GRANT (no-display machines)
log = "python run.py log"
install = "python install.py"           # register the plugin + permission rules for this user
