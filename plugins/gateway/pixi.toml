# Self-contained runtime for the gateway plugin.
# Recipients need only Claude Code + pixi; pixi provides the Python and the
# `age` binary below, so no system install is required. All gateway code is
# pure standard library; age decrypts `age:` secret references.
[workspace]
name = "gateway"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = "3.12.*"
age = "1.3.*"

[tasks]
server = "python run.py server"
test = "python tests/run_tests.py"
vault = "python run.py vault"            # terminal fallback: pixi run vault secret add NAME desc
log = "python run.py log"
install = "python install.py"           # register the plugin + permission rules for this user
