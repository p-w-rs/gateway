# The gateway's managed remote runtime (PLAN-v4 phase 6, docs/dev/modules/remote.md).
# Not an environment the gateway installs here: gated packs it with pixi-pack
# for each remote host's platform (into its plugin data folder, from this
# manifest and pixi.lock exactly as committed) and stages the pack on the
# host, where the target's own pixi-unpack unpacks it into
# ~/.local/share/gateway-runtime/<version>-<platform>/ (or the host's
# `runtime` path). bash and tmux only: no Python (a pack with Python is ~85 MB,
# FEASIBILITY-v4 P5). The `unpacker` environment is never staged as a pack:
# it holds the target platform's pixi-unpack, whose files gated takes out of
# the conda packages locally (it never runs a target's binary here).
[workspace]
name = "gateway-runtime"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]

[dependencies]
bash = "5.*"             # the remote managed shell (no profile, no user rc)
tmux = "3.*"             # the remote supervisor: a private socket under the runtime folder

[feature.unpacker.dependencies]
pixi-unpack = "0.7.*"    # unpacks the runtime pack on the host (with its openssl and libgcc)

[environments]
unpacker = { features = ["unpacker"], no-default-feature = true }
